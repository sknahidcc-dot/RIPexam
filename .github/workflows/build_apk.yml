name: Build RIP-Exam APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore or Generate debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"106478423080","project_id":"ripexam-app","storage_bucket":"ripexam-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:106478423080:android:0123456789abcdef012345","android_client_info":{"package_name":"com.aistudio.ripexam.omr"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyFakeKeyForRIPExamLocalBuild123456789"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi
          ls -la app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify and Locate APK
        run: |
          echo "=== Built APK Files ==="
          find app/build/outputs/apk/ -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIP-Exam-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

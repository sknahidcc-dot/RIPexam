name: Build RIP-Exam Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore or Generate debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"106478423080","project_id":"ripexam-app","storage_bucket":"ripexam-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:106478423080:android:0123456789abcdef012345","android_client_info":{"package_name":"com.aistudio.ripexam.omr"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyFakeKeyForRIPExamLocalBuild123456789"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi
          ls -la app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Running flutter build apk --release..."
            flutter pub get
            flutter build apk --release
          elif [ -f "./gradlew" ]; then
            echo "Running ./gradlew assembleRelease..."
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Output Paths
        run: |
          mkdir -p build/app/outputs/flutter-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp -f app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk
          fi
          echo "=== Found Release APKs ==="
          ls -la build/app/outputs/flutter-apk/ || true
          find app/build/outputs/apk/ -name "*.apk" || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIP-Exam-Release-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
